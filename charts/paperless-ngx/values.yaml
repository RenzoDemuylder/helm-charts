## @section Paperless-ngx parameters
##

## Paperless-ngx image
## ref: https://github.com/paperless-ngx/paperless-ngx/pkgs/container/paperless-ngx
## @param image.registry [default: REGISTRY_NAME] Paperless-ngx image registry
## @param image.repository [default: REPOSITORY_NAME/paperless-ngx] Paperless-ngx image repository
## @skip image.tag Paperless-ngx image tag (immutable tags are recommended)
## @param image.digest Paperless-ngx image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
## @param image.pullPolicy Paperless-ngx image pull policy
## @param image.pullSecrets Paperless-ngx image pull secrets
##
image:
  registry: ghcr.io
  repository: paperless-ngx/paperless-ngx
  tag: 3.4.0
  digest: ""
  ## Specify a imagePullPolicy
  ## ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
  ##
  pullPolicy: IfNotPresent
  ## Optionally specify an array of imagePullSecrets.
  ## Secrets must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ## e.g:
  ## pullSecrets:
  ##   - myRegistryKeySecretName
  ##
  pullSecrets: []
## @param secretKey Secret key used for cryptographic signing (PAPERLESS_SECRET_KEY). Generated randomly (64 chars) and preserved across upgrades if empty
##
secretKey: ""
## @param existingSecret Name of an existing Secret containing the Paperless-ngx credentials (see keys below)
## Expected keys: `secret-key`, `admin-password` (when admin.enabled) and, when the matching feature is used, `smtp-password`, `redis-password` (only with externalRedis and no externalRedis.existingSecret), `database-password` (only with externalDatabase and no externalDatabase.existingSecret)
##
existingSecret: ""
## @param url Public URL Paperless-ngx is reachable at (PAPERLESS_URL). Defaults to the first ingress host, when enabled; otherwise unset so any Host header is accepted
##
url: ""
## @param timezone Timezone of the container (PAPERLESS_TIME_ZONE)
##
timezone: UTC
## OCR settings
## ref: https://docs.paperless-ngx.com/configuration/#ocr
## NOTE: PAPERLESS_OCR_LANGUAGES (installs extra languages at startup) needs root and is not supported. Use an image that already contains them.
## @param ocr.language Tesseract language(s) used for OCR, e.g. `eng` or `deu+eng` (PAPERLESS_OCR_LANGUAGE)
##
ocr:
  language: eng
## Initial administrator, created on first start when no superuser exists
## @param admin.enabled Create the initial administrator (PAPERLESS_ADMIN_USER/PASSWORD/MAIL). When disabled, create one with `manage.py createsuperuser`
## @param admin.username Administrator username
## @param admin.password Administrator password (stored in the Secret, key `admin-password`). Generated randomly (24 chars) and preserved across upgrades if empty
## @param admin.email Administrator email address
##
admin:
  enabled: true
  username: admin
  password: ""
  email: ""
## Apache Tika and Gotenberg (parsing of Office documents and emails). They are not deployed by this chart.
## ref: https://docs.paperless-ngx.com/configuration/#tika
## @param tika.enabled Enable Tika/Gotenberg document parsing (PAPERLESS_TIKA_ENABLED)
## @param tika.endpoint Tika server URL (PAPERLESS_TIKA_ENDPOINT), e.g. http://tika:9998
## @param tika.gotenbergEndpoint Gotenberg server URL (PAPERLESS_TIKA_GOTENBERG_ENDPOINT), e.g. http://gotenberg:3000
##
tika:
  enabled: false
  endpoint: ""
  gotenbergEndpoint: ""
## Outgoing email settings
## ref: https://docs.paperless-ngx.com/configuration/#email-sending
## @param smtp.host SMTP server host (PAPERLESS_EMAIL_HOST). Email is only configured when set
## @param smtp.port SMTP server port (PAPERLESS_EMAIL_PORT)
## @param smtp.username SMTP username (PAPERLESS_EMAIL_HOST_USER)
## @param smtp.password SMTP password (stored in the Secret, key `smtp-password`)
## @param smtp.fromEmail Sender email address (PAPERLESS_EMAIL_FROM)
## @param smtp.useTls Use STARTTLS (PAPERLESS_EMAIL_USE_TLS)
## @param smtp.useSsl Use implicit TLS (PAPERLESS_EMAIL_USE_SSL)
##
smtp:
  host: ""
  port: 587
  username: ""
  password: ""
  fromEmail: ""
  useTls: true
  useSsl: false
## @param command Override default container command (useful when using custom images)
##
command: []
## @param args Override default container args (useful when using custom images)
##
args: []
## @param extraEnvVars Array with extra environment variables to add to the Paperless-ngx container
## e.g:
## extraEnvVars:
##   - name: PAPERLESS_OCR_MODE
##     value: "skip"
##
extraEnvVars: []
## @param extraEnvVarsCM Name of existing ConfigMap containing extra env vars
##
extraEnvVarsCM: ""
## @param extraEnvVarsSecret Name of existing Secret containing extra env vars
##
extraEnvVarsSecret: ""
## @param replicaCount Number of Paperless-ngx replicas to deploy. Paperless-ngx keeps state on local volumes and runs its own task workers: do not scale above 1
##
replicaCount: 1
## @param containerPorts.http Paperless-ngx HTTP container port (PAPERLESS_PORT)
##
containerPorts:
  http: 8000
## Configure extra options for Paperless-ngx containers' liveness, readiness and startup probes
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#configure-probes
## The probes request /accounts/login/ (the image HEALTHCHECK requests / and follows the redirect).
## @param livenessProbe.enabled Enable livenessProbe on Paperless-ngx containers
## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
## @param livenessProbe.periodSeconds Period seconds for livenessProbe
## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
## @param livenessProbe.successThreshold Success threshold for livenessProbe
##
livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6
  successThreshold: 1
## @param readinessProbe.enabled Enable readinessProbe on Paperless-ngx containers
## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
## @param readinessProbe.periodSeconds Period seconds for readinessProbe
## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
## @param readinessProbe.successThreshold Success threshold for readinessProbe
##
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 6
  successThreshold: 1
## @param startupProbe.enabled Enable startupProbe on Paperless-ngx containers (waits for migrations to complete)
## @param startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
## @param startupProbe.periodSeconds Period seconds for startupProbe
## @param startupProbe.timeoutSeconds Timeout seconds for startupProbe
## @param startupProbe.failureThreshold Failure threshold for startupProbe
## @param startupProbe.successThreshold Success threshold for startupProbe
##
startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 120
  successThreshold: 1
## @param customLivenessProbe Custom livenessProbe that overrides the default one
##
customLivenessProbe: {}
## @param customReadinessProbe Custom readinessProbe that overrides the default one
##
customReadinessProbe: {}
## @param customStartupProbe Custom startupProbe that overrides the default one
##
customStartupProbe: {}
## Paperless-ngx resource requests and limits
## ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
## @param resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge). This is ignored if resources is set (resources is recommended for production).
## Sizes are defined in charts/common/templates/_resources.tpl
##
resourcesPreset: large
## @param resources Set container requests and limits for different resources like CPU or memory (essential for production workloads)
## Example:
## resources:
##   requests:
##     cpu: 2
##     memory: 512Mi
##   limits:
##     cpu: 3
##     memory: 1024Mi
##
resources: {}
## Configure Pods Security Context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
## @param podSecurityContext.enabled Enabled Paperless-ngx pods' Security Context
## @param podSecurityContext.fsGroupChangePolicy Set filesystem group change policy
## @param podSecurityContext.sysctls Set kernel settings using the sysctl interface
## @param podSecurityContext.supplementalGroups Set filesystem extra groups
## @param podSecurityContext.fsGroup Set Paperless-ngx pod's Security Context fsGroup
##
podSecurityContext:
  enabled: true
  fsGroupChangePolicy: Always
  sysctls: []
  supplementalGroups: []
  fsGroup: 1000
## Configure Container Security Context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
## @param containerSecurityContext.enabled Enabled Paperless-ngx containers' Security Context
## @param containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in container
## @param containerSecurityContext.runAsUser Set Paperless-ngx containers' Security Context runAsUser
## @param containerSecurityContext.runAsGroup Set Paperless-ngx containers' Security Context runAsGroup
## @param containerSecurityContext.runAsNonRoot Set Paperless-ngx containers' Security Context runAsNonRoot
## @param containerSecurityContext.privileged Set container's Security Context privileged
## @param containerSecurityContext.readOnlyRootFilesystem Set container's Security Context readOnlyRootFilesystem
## @param containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
## @param containerSecurityContext.capabilities.drop List of capabilities to be dropped
## @param containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
##
containerSecurityContext:
  enabled: true
  seLinuxOptions: {}
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: "RuntimeDefault"
## @param automountServiceAccountToken Mount Service Account token in Paperless-ngx pods
##
automountServiceAccountToken: false
## @param hostAliases Paperless-ngx pods host aliases
## https://kubernetes.io/docs/concepts/services-networking/add-entries-to-pod-etc-hosts-with-host-aliases/
##
hostAliases: []
## @param podLabels Extra labels for Paperless-ngx pods
## Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
##
podLabels: {}
## @param podAnnotations Annotations for Paperless-ngx pods
## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
##
podAnnotations: {}
## @param podAffinityPreset Pod affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
