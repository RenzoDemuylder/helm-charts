{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-health" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: test
    # lets the pod through the Paperless-ngx NetworkPolicy when networkPolicy.allowExternal=false
    {{ template "common.names.fullname" . }}-client: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- if .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
    {{- end }}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- include "paperless-ngx.imagePullSecrets" . | nindent 2 }}
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: {{ template "paperless-ngx.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext: {{- include "paperless-ngx.tests.securityContext" . | nindent 8 }}
      command:
        - sh
        - -c
        - |
          url="http://{{ include "common.names.fullname" . }}.{{ include "common.names.namespace" . }}.svc.{{ .Values.clusterDomain }}:{{ .Values.service.ports.http }}/accounts/login/"
          echo "GET $url"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 -o /dev/null "$url"; then
              echo "Paperless-ngx answered"
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep 5
          done
          echo "Paperless-ngx did not answer through its Service" >&2
          exit 1
      resources: {{- include "common.resources.preset" (dict "type" "nano") | nindent 8 }}
{{- end }}
