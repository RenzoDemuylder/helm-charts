{{- $needsDatabasePassword := and (eq (include "paperless-ngx.database.mode" .) "external") (not .Values.externalDatabase.existingSecret) }}
{{- $needsRedisPassword := and (not .Values.redis.enabled) (not .Values.externalRedis.existingSecret) .Values.externalRedis.password }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paperless-ngx.secretName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: paperless-ngx
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  secret-key: {{ include "common.secrets.generate" (dict "secret" (include "paperless-ngx.secretName" .) "key" "secret-key" "provided" .Values.secretKey "length" 64 "context" $) }}
  {{- if .Values.admin.enabled }}
  admin-password: {{ include "common.secrets.generate" (dict "secret" (include "paperless-ngx.secretName" .) "key" "admin-password" "provided" .Values.admin.password "length" 24 "context" $) }}
  {{- end }}
  {{- if .Values.smtp.password }}
  smtp-password: {{ .Values.smtp.password | b64enc | quote }}
  {{- end }}
  {{- if $needsRedisPassword }}
  redis-password: {{ .Values.externalRedis.password | b64enc | quote }}
  {{- end }}
  {{- if $needsDatabasePassword }}
  database-password: {{ .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
{{- end }}
