suite: deployment
templates:
  - templates/deployment.yaml
  # included by the deployment for its checksum annotation
  - templates/secret.yaml
release:
  name: t
tests:
  - it: runs one Recreate replica of the pinned app version
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/bellamy/scrob:2.33.0

  - it: keeps selector labels stable (they are immutable once released)
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: scrob
            app.kubernetes.io/instance: t
            app.kubernetes.io/component: scrob

  - it: is locked down by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: sets resources from the preset
    template: templates/deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].resources.limits
      - exists:
          path: spec.template.spec.containers[0].resources.requests

  - it: lets explicit resources win over the preset
    template: templates/deployment.yaml
    set:
      resources:
        requests:
          cpu: 10m
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 10m

  - it: uses the bundled PostgreSQL by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST
            value: t-scrob-postgresql
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: t-scrob-postgresql
                key: password

  - it: uses the CloudNativePG read-write service and app secret
    template: templates/deployment.yaml
    set:
      postgresql.enabled: false
      cnpg.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST
            value: t-scrob-db-rw
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: t-scrob-db-app
                key: password

  - it: uses an external database
    template: templates/deployment.yaml
    set:
      postgresql.enabled: false
      externalDatabase.host: db.example.org
      externalDatabase.port: 6432
      externalDatabase.password: s3cret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST
            value: db.example.org
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PORT
            value: "6432"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: t-scrob
                key: database-password

  - it: reads external database credentials from an existing secret
    template: templates/deployment.yaml
    set:
      postgresql.enabled: false
      externalDatabase.existingSecret: my-db
      externalDatabase.existingSecretKeys:
        host: host
        password: pw
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST
            valueFrom:
              secretKeyRef:
                name: my-db
                key: host
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-db
                key: pw

  - it: points SERVER_URL at the ingress host when enabled
    template: templates/deployment.yaml
    set:
      ingress.enabled: true
      ingress.hostname: scrob.example.org
      ingress.tls: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVER_URL
            value: https://scrob.example.org

  - it: drops probes and overrides the command in diagnostic mode
    template: templates/deployment.yaml
    set:
      diagnosticMode.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - exists:
          path: spec.template.spec.containers[0].command

  - it: uses an emptyDir instead of a PVC when persistence is disabled
    template: templates/deployment.yaml
    set:
      persistence.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}

  - it: refuses more than one replica
    template: templates/deployment.yaml
    set:
      replicaCount: 2
    asserts:
      - failedTemplate:
          errorPattern: "Do not run more than 1 replica"

  - it: refuses two databases at once
    template: templates/deployment.yaml
    set:
      cnpg.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "Both are enabled"

  - it: refuses to start without any database
    template: templates/deployment.yaml
    set:
      postgresql.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "externalDatabase.host"
