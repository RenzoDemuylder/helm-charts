## @section Database parameters
##

## PostgreSQL deployed by the `postgresql` subchart (charts/postgresql, official postgres image)
## Scrob requires PostgreSQL. Set `postgresql.enabled=false` and fill `externalDatabase` to use your own server.
## Only the values Scrob sets or reads are listed here; every other value of the subchart (persistence, resources,
## security contexts, networkPolicy, ...) can be set under `postgresql.` too, see the README of the postgresql chart.
##
postgresql:
  ## @param postgresql.enabled Deploy the PostgreSQL subchart. Disable it to use CloudNativePG or an external database
  ##
  enabled: true
  ## Authentication parameters
  ## @param postgresql.auth.username Name for the database user (also a superuser of the embedded server)
  ## @param postgresql.auth.password Password for the database user. Generated randomly and preserved across upgrades if empty
  ## @param postgresql.auth.database Name for the database
  ## @param postgresql.auth.existingSecret Name of existing secret to use for the PostgreSQL password
  ## @param postgresql.auth.secretKeys.passwordKey Name of the key in the existing secret containing the password
  ##
  auth:
    username: scrob
    password: ""
    database: scrob
    existingSecret: ""
    secretKeys:
      passwordKey: password
  ## @param postgresql.service.ports.postgresql PostgreSQL service port
  ##
  service:
    ports:
      postgresql: 5432
  ## @param postgresql.resourcesPreset Set PostgreSQL container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge). This is ignored if postgresql.resources is set.
  ##
  resourcesPreset: micro
## CloudNativePG cluster created by this chart (requires the CloudNativePG operator and its CRDs in the cluster)
## ref: https://cloudnative-pg.io/documentation/current/
## Mutually exclusive with `postgresql.enabled`. Scrob connects to the `<release>-scrob-db-rw` service using the
## `<release>-scrob-db-app` Secret generated by the operator. To use a cluster you manage yourself, see `externalDatabase`.
##
cnpg:
  ## @param cnpg.enabled Create a CloudNativePG Cluster for Scrob (also set `postgresql.enabled=false`)
  ##
  enabled: false
  ## @param cnpg.instances Number of PostgreSQL instances (1 primary + replicas)
  ##
  instances: 1
  ## @param cnpg.imageName PostgreSQL image for the cluster. Empty uses the operator's default image
  ## e.g. ghcr.io/cloudnative-pg/postgresql:17
  ##
  imageName: ""
  ## @param cnpg.database Database created by the cluster for Scrob
  ## @param cnpg.owner Owner (login role) of the database
  ##
  database: scrob
  owner: scrob
  ## @param cnpg.storage.size Size of each instance's data volume
  ## @param cnpg.storage.storageClass StorageClass of the data volumes (falls back to the global default)
  ##
  storage:
    size: 8Gi
    storageClass: ""
  ## @param cnpg.resourcesPreset Set PostgreSQL container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge). This is ignored if cnpg.resources is set.
  ##
  resourcesPreset: small
  ## @param cnpg.resources Set PostgreSQL container requests and limits for different resources like CPU or memory
  ##
  resources: {}
  ## @param cnpg.annotations Annotations for the Cluster resource. e.g. `helm.sh/resource-policy: keep` keeps the cluster (and its data) on `helm uninstall`
  ##
  annotations: {}
  ## @param cnpg.extraSpec Additional `spec` fields for the Cluster (backup, monitoring, postgresql.parameters, ...). Takes precedence over the fields above
  ## e.g.
  ## extraSpec:
  ##   postgresql:
  ##     parameters:
  ##       max_connections: "200"
  ##
  extraSpec: {}
## External database configuration, used when `postgresql.enabled=false` and `cnpg.enabled=false`
##
externalDatabase:
  ## @param externalDatabase.host Database host. Not needed when `externalDatabase.existingSecretKeys.host` is set
  ##
  host: ""
  ## @param externalDatabase.port Database port number. Ignored when `externalDatabase.existingSecretKeys.port` is set
  ##
  port: 5432
  ## @param externalDatabase.user Non-root username for Scrob. Ignored when `externalDatabase.existingSecretKeys.user` is set
  ##
  user: scrob
  ## @param externalDatabase.password Password for the non-root username for Scrob. Ignored when `externalDatabase.existingSecret` is set
  ##
  password: ""
  ## @param externalDatabase.database Scrob database name. Ignored when `externalDatabase.existingSecretKeys.database` is set
  ##
  database: scrob
  ## @param externalDatabase.existingSecret Name of an existing Secret containing the database credentials (e.g. a CloudNativePG `<cluster>-app` Secret)
  ##
  existingSecret: ""
  ## Keys inside `externalDatabase.existingSecret`. Only `password` is required; leave the others empty to use the plain values above
  ## CloudNativePG `<cluster>-app` Secret: host=host, port=port, user=username, password=password, database=dbname
  ## @param externalDatabase.existingSecretKeys.host Key holding the database host
  ## @param externalDatabase.existingSecretKeys.port Key holding the database port
  ## @param externalDatabase.existingSecretKeys.user Key holding the database user
  ## @param externalDatabase.existingSecretKeys.password Key holding the database password
  ## @param externalDatabase.existingSecretKeys.database Key holding the database name
  ##
  existingSecretKeys:
    host: ""
    port: ""
    user: ""
    password: password
    database: ""
## Wait for the database to accept connections before starting Scrob
##
waitForDatabase:
  ## @param waitForDatabase.enabled Add an init container that waits for PostgreSQL
  ##
  enabled: true
  ## Image of the init container (needs `pg_isready`)
  ## @param waitForDatabase.image.registry wait-for-database image registry
  ## @param waitForDatabase.image.repository wait-for-database image repository
  ## @skip waitForDatabase.image.tag wait-for-database image tag (immutable tags are recommended)
  ## @param waitForDatabase.image.digest wait-for-database image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
  ## @param waitForDatabase.image.pullPolicy wait-for-database image pull policy
  ## @param waitForDatabase.image.pullSecrets wait-for-database image pull secrets
  ##
  image:
    registry: docker.io
    repository: library/postgres
    tag: 17-alpine
    digest: ""
    pullPolicy: IfNotPresent
    pullSecrets: []
