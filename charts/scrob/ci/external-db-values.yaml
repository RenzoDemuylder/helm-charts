# externalDatabase pointing at a throwaway PostgreSQL deployed next to the release through extraDeploy
resourcesPreset: small
postgresql:
  enabled: false
externalDatabase:
  host: ci-extdb
  port: 5432
  user: scrob
  password: ci-password
  database: scrob
# every case installs into its own namespace, so fixed names are safe
extraDeploy:
  - apiVersion: v1
    kind: Service
    metadata:
      name: ci-extdb
      labels:
        app.kubernetes.io/name: extdb
        app.kubernetes.io/instance: ci
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: extdb
    spec:
      selector:
        app.kubernetes.io/name: extdb
        app.kubernetes.io/instance: ci
      ports:
        - name: postgresql
          port: 5432
          targetPort: postgresql
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ci-extdb
      labels:
        app.kubernetes.io/name: extdb
        app.kubernetes.io/instance: ci
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: extdb
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: extdb
          app.kubernetes.io/instance: ci
      template:
        metadata:
          labels:
            app.kubernetes.io/name: extdb
            app.kubernetes.io/instance: ci
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/component: extdb
        spec:
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: postgresql
              image: docker.io/library/postgres:17-alpine
              env:
                - name: POSTGRES_USER
                  value: scrob
                - name: POSTGRES_PASSWORD
                  value: ci-password
                - name: POSTGRES_DB
                  value: scrob
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
              ports:
                - name: postgresql
                  containerPort: 5432
              readinessProbe:
                exec:
                  command: ["pg_isready", "-U", "scrob", "-d", "scrob"]
                periodSeconds: 5
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 70
                runAsGroup: 70
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data
                - name: run
                  mountPath: /var/run/postgresql
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              emptyDir: {}
            - name: run
              emptyDir: {}
            - name: tmp
              emptyDir: {}
