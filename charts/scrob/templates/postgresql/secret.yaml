{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scrob.postgresql.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: postgresql
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ .Values.postgresql.auth.secretKeys.passwordKey }}: {{ include "common.secrets.generate" (dict "secret" (include "scrob.postgresql.fullname" .) "key" .Values.postgresql.auth.secretKeys.passwordKey "provided" .Values.postgresql.auth.password "length" 24 "context" $) }}
{{- end }}
