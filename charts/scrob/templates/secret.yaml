{{- $needsDatabasePassword := and (eq (include "scrob.database.mode" .) "external") (not .Values.externalDatabase.existingSecret) }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scrob.secretName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: scrob
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  secret-key: {{ include "common.secrets.generate" (dict "secret" (include "scrob.secretName" .) "key" "secret-key" "provided" .Values.secretKey "length" 64 "context" $) }}
  {{- if .Values.oidc.clientSecret }}
  oidc-client-secret: {{ .Values.oidc.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.trakt.clientSecret }}
  trakt-client-secret: {{ .Values.trakt.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.smtp.password }}
  smtp-password: {{ .Values.smtp.password | b64enc | quote }}
  {{- end }}
  {{- if $needsDatabasePassword }}
  database-password: {{ .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
{{- end }}
