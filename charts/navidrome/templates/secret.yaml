{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "navidrome.secretName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: navidrome
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  password-encryption-key: {{ include "common.secrets.generate" (dict "secret" (include "navidrome.secretName" .) "key" "password-encryption-key" "provided" .Values.passwordEncryptionKey "length" 32 "context" $) }}
  {{- if .Values.adminPassword }}
  admin-password: {{ .Values.adminPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.lastfm.apiKey }}
  lastfm-api-key: {{ .Values.lastfm.apiKey | b64enc | quote }}
  lastfm-secret: {{ .Values.lastfm.secret | b64enc | quote }}
  {{- end }}
  {{- if .Values.prometheus.password }}
  prometheus-password: {{ .Values.prometheus.password | b64enc | quote }}
  {{- end }}
{{- end }}
