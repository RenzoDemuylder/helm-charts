{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-connection" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: test
    # lets the pod through the PostgreSQL NetworkPolicy when networkPolicy.allowExternal=false
    {{ include "common.names.fullname" . }}-client: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- if .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
    {{- end }}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- include "postgresql.imagePullSecrets" . | nindent 2 }}
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: connection
      image: {{ include "postgresql.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext: {{- include "postgresql.tests.securityContext" . | nindent 8 }}
      command:
        - sh
        - -c
        - |
          host="{{ include "common.names.fullname" . }}.{{ include "common.names.namespace" . }}.svc.{{ .Values.clusterDomain }}"
          port="{{ .Values.service.ports.postgresql }}"
          for attempt in 1 2 3 4 5 6; do
            if pg_isready -h "$host" -p "$port" -U "{{ .Values.auth.username }}" -d "{{ .Values.auth.database }}"; then
              echo "PostgreSQL answered through its Service"
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep 5
          done
          echo "PostgreSQL did not answer through its Service" >&2
          exit 1
      resources: {{- include "common.resources.preset" (dict "type" "nano") | nindent 8 }}
{{- end }}
