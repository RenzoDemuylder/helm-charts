suite: helm test hooks
templates:
  - templates/tests/connection.yaml
  - templates/tests/networkpolicy-deny.yaml
release:
  name: t
tests:
  - it: renders the connection test only by default
    asserts:
      - hasDocuments:
          count: 1
        template: templates/tests/connection.yaml
      - hasDocuments:
          count: 0
        template: templates/tests/networkpolicy-deny.yaml

  - it: marks the connection test as a helm test hook that satisfies the restricted profile
    template: templates/tests/connection.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - equal:
          path: metadata.labels["t-redis-client"]
          value: "true"
      - equal:
          path: spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]
      - equal:
          path: spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: renders the network policy test when enabled, without the client label
    set:
      tests.networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 1
        template: templates/tests/networkpolicy-deny.yaml
      - notExists:
          path: metadata.labels["t-redis-client"]
        template: templates/tests/networkpolicy-deny.yaml

  - it: skips the network policy test when everyone is allowed in
    template: templates/tests/networkpolicy-deny.yaml
    set:
      tests.networkPolicy.enabled: true
      networkPolicy.allowExternal: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no test pods when disabled
    set:
      tests.enabled: false
      tests.networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 0
        template: templates/tests/connection.yaml
      - hasDocuments:
          count: 0
        template: templates/tests/networkpolicy-deny.yaml
