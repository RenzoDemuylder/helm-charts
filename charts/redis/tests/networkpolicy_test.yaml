suite: network policy
templates:
  - templates/networkpolicy.yaml
release:
  name: t
tests:
  - it: only lets client-labelled pods in by default
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels
          value:
            t-redis-client: "true"
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 6379

  - it: allows everyone when asked to
    set:
      networkPolicy.allowExternal: true
    asserts:
      - notExists:
          path: spec.ingress[0].from

  - it: allows labelled namespaces
    set:
      networkPolicy.ingressNSMatchLabels:
        team: apps
    asserts:
      - equal:
          path: spec.ingress[0].from[1].namespaceSelector.matchLabels
          value:
            team: apps

  - it: renders nothing when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
