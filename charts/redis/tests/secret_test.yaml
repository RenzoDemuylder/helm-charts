suite: secret and service
templates:
  - templates/secret.yaml
  - templates/service.yaml
release:
  name: t
tests:
  - it: generates a password
    template: templates/secret.yaml
    asserts:
      - isKind:
          of: Secret
      - exists:
          path: data["redis-password"]

  - it: stores a given password
    template: templates/secret.yaml
    set:
      auth.password: hunter2
    asserts:
      - equal:
          path: data["redis-password"]
          value: aHVudGVyMg==

  - it: skips the secret when auth is disabled
    template: templates/secret.yaml
    set:
      auth.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: skips the secret when an existing one is given
    template: templates/secret.yaml
    set:
      auth.existingSecret: mine
    asserts:
      - hasDocuments:
          count: 0

  - it: exposes Redis through a ClusterIP service
    template: templates/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 6379
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: redis
